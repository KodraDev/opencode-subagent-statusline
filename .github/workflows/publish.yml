name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check whether this version is new
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { name, version, private: isPrivate } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (isPrivate) throw new Error('Refusing to publish a private package')
          if (name !== 'kodradev-opencode-subagent-statusline') throw new Error('Unexpected package name')
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`Expected a stable version, received ${version}`)
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) })
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry lookup failed: HTTP ${response.status}`)
          }
          const publish = response.status === 404
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`)
          console.log(publish ? `Publishing ${name}@${version}` : `${name}@${version} already exists; skipping`)
          NODE

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.publish == 'true'

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check types
        if: steps.release.outputs.publish == 'true'
        run: pnpm run typecheck

      - name: Build and pack
        if: steps.release.outputs.publish == 'true'
        run: pnpm pack --out package.tgz

      - name: Publish with OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm publish ./package.tgz --access public
